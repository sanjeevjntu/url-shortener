name: security
# Security quality gates, separate from the build so they can be required independently:
#   - CodeQL: static security analysis of the Java code (injection, unsafe deserialisation, ...)
#   - Dependency review: blocks a PR that adds a dependency with a known high/critical vulnerability
#   - Dependency submission: sends the resolved Gradle graph to GitHub, enabling Dependabot alerts on main
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, to catch newly published CVEs in unchanged dependencies

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none # analyses sources directly; no Gradle build needed
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the dependency graph API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/dependency-submission@v4
