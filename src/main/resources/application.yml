spring:
  application:
    name: url-shortener
  threads:
    virtual:
      enabled: true # blocking JDBC code, high concurrency; the Hikari pool is the real limiter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener} # local-dev default only; override via environment in any real deployment
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 1500 # fail fast: a saturated pool must surface as an error, not as latency
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
  # api-keys: deliberately NOT in the repository. Without one the app refuses to start, except in the "local"
  # profile, where a random key is generated for the run and printed in the log. "local" is the default when the app
  # starts from a checkout (config/application.yml: IntelliJ, ./gradlew bootRun) and is set by docker compose.
  # Only SHA-256 hashes are configured, never keys, e.g. via environment or a secret store:
  #   SHORTENER_APIKEYS_0_NAME=ops  SHORTENER_APIKEYS_0_SHA256=<hash>  SHORTENER_APIKEYS_0_SCOPES=links:delete,stats:read
  #   SHORTENER_APIKEYS_0_EXPIRESAT=2027-06-30T00:00:00Z   (optional; forces rotation)
  # Stable local key: scripts/new-api-key.sh dev --local  (writes git-ignored config/application-local.yml + .env)
  code:
    length: 8        # Base58: 58^8 ~ 1.28e14 codes (decision D3)
    max-attempts: 5  # redraws on a collision before answering 503
  cache:
    max-size: 100000
    ttl: 5m          # also bounds how long another instance may serve a deleted link
    negative-ttl: 30s
  analytics:
    mode: async      # async | sync (sync = baseline / rollback switch, decision D4)
    queue-capacity: 100000
    max-batch: 10000
  rate-limits:       # create: per API key; redirect and auth-failure: per IP (IPv4 address or IPv6 /64)
    create:   { capacity: 10,  refill-per-minute: 10 }
    redirect: { capacity: 200, refill-per-minute: 6000 }
    auth-failure: { capacity: 10, refill-per-minute: 5 } # only failed API-key attempts consume this
  idempotency-ttl: 24h

logging:
  pattern:
    level: "%5p [%X{traceId:-}]" # every log line carries the request's trace ID

# Behind a load balancer, trust ITS X-Forwarded-For (never clients'):
#   server.forward-headers-strategy: native
#   server.tomcat.remoteip.internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    port: ${MANAGEMENT_PORT:8081} # actuator on its own port: keep it off the public load balancer
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness
